<div class="page-container">
  <app-sidebar></app-sidebar>

  <div class="main">
    <app-header [pageTitle]="'Offers'"></app-header>

    <div class="content">
      <div class="section-header">
        <h2> Special Offers</h2>
      </div>

      <div class="offers-grid">
        @for (offer of offers; track offer.id) {
          <div class="offer-card" [style.border-color]="offer.color">
            <div class="offer-header" [style.background-color]="offer.color">
              <h3>{{ offer.days }}</h3>
            </div>
            <div class="offer-body">
              <p class="offer-description">{{ offer.description }}</p>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>
