<header>
  <h3 class="page-heading">{{ pageTitle }}</h3>
  <div class="header-right">
    <div class="search-bar">
      <i class='bx bx-search-alt'></i>
      <input type="search" class="search-input" placeholder="Search in Pick Your Cloth" />
    </div>
    <i class='bx bx-bell' id="notification"></i>
    <div class="profile-tab" (click)="onLogout()">
      <div class="profile-circle">A</div>
      <i class='bx bx-chevron-down'></i>
    </div>
  </div>
</header>
